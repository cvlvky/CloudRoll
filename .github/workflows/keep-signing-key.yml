# The APK signing key lives in the Actions cache (when no CLOUDROLL_KEYSTORE_B64 secret is set).
# GitHub deletes cache entries nobody reads for 7 days, and a lost key means new versions can no
# longer install over the app on your phone. This job reads the key every few days so it stays.
name: Keep the signing key

on:
  schedule:
    - cron: "41 5 */4 * *"
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - name: Read the cached signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/.cloudroll-key
          key: cloudroll-signing-key-v1
      - name: Report
        run: |
          if [ "${{ steps.key.outputs.cache-hit }}" = "true" ]; then echo "Signing key is still cached."; else echo "::warning::The cached signing key was not found."; fi
