name: Build APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLOUDROLL_KEYSTORE_PASSWORD: ${{ secrets.CLOUDROLL_KEYSTORE_PASSWORD || 'cloudroll-key-2026' }}
      CLOUDROLL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Make sure Android SDK 37 is installed
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; "$SDKM" "platforms;android-37" > /dev/null || true; fi

      - name: Restore the signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.cloudroll-key
          key: cloudroll-signing-key-v1

      - name: Signing key (kept private, never published)
        env:
          KEY_B64: ${{ secrets.CLOUDROLL_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.cloudroll-key
          KS="$HOME/.cloudroll-key/cloudroll.jks"
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$KS"; echo "Using the key from repository secrets."
          elif [ -f "$KS" ]; then
            echo "Using the cached signing key."
          else
            echo "Creating a new signing key."
            keytool -genkeypair -keystore "$KS" -storepass "$CLOUDROLL_KEYSTORE_PASSWORD" -keypass "$CLOUDROLL_KEYSTORE_PASSWORD" \
              -alias cloudroll -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CloudRoll, O=cvlvky, C=QA"
          fi
          echo "CLOUDROLL_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Save the signing key for the next build
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ~/.cloudroll-key
          key: cloudroll-signing-key-v1

      - name: Build the APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CloudRoll-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CloudRoll-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          V="1.0.${{ github.run_number }}"
          {
            echo "## What's new"
            printf '%s\n' "${COMMIT_MSG:-manual run}" | grep -viE '^(co-authored-by|claude-session|signed-off-by):' || true
            echo ""
            echo "## Install on your phone"
            echo "1. Already have CloudRoll? Open it and tap **Update now** when it asks."
            echo "2. Otherwise tap **CloudRoll-$V.apk** below to download it, then open the file."
            echo "3. Updates install over the old version and keep your sign-in and settings."
          } > notes.md
          gh release create "v$V" "out/CloudRoll-$V.apk" --title "CloudRoll $V" --notes-file notes.md --latest

      # Leaves the result and the end of the build log on the ci-log branch, so a failed build can be
      # read and fixed without opening the Actions page.
      - name: Record the build result
        if: always()
        run: |
          mkdir -p /tmp/cilog
          echo "run ${{ github.run_number }}: ${{ job.status }} at $(date -u +%FT%TZ) for ${GITHUB_SHA}" > /tmp/cilog/status.txt
          if [ -f build.log ]; then
            grep -nE '^e: |error:|ERROR|FAILURE|What went wrong|Could not|> Task .* FAILED|Unresolved|Exception' build.log | head -300 > /tmp/cilog/errors.txt || true
            tail -n 400 build.log > /tmp/cilog/build-tail.log
          fi
          cd /tmp/cilog
          git init -q
          git checkout -q -b ci-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" ci-log || true
